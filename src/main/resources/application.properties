spring.application.name=sgma-andina
server.port=8080

# --- Base de datos H2 en modo PostgreSQL (ejecuta schema_sgma.sql automáticamente) ---
spring.datasource.url=jdbc:h2:mem:sgma_andina;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Esquema e inicialización ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:database/schema_sgma.sql
spring.sql.init.encoding=UTF-8

# --- Consola web de H2 (para revisar las tablas): http://localhost:8080/h2-console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Subida de archivos (fotos de anomalías) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# --- Configuración propia SGMA ---
app.upload-dir=uploads
app.cors.allowed-origin=http://localhost:5173